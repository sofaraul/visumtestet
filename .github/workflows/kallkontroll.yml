name: Källkontroll

on:
  schedule:
    - cron: '17 4 * * *' # varje dag, 06:17 svensk sommartid
  workflow_dispatch:
    inputs:
      lage:
        description: 'kontrollera = daglig kontroll. foresla = hämta källorna och föreslå citat (ändrar inte regler).'
        type: choice
        options: [kontrollera, foresla]
        default: kontrollera

permissions:
  contents: write # spara rapport och ändrade regler
  issues: write # skapa ärenden med etiketten källkontroll

concurrency:
  group: kallkontroll
  cancel-in-progress: false

jobs:
  kontroll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Växelkurs
        id: kurs
        if: inputs.lage != 'foresla'
        continue-on-error: true # källkontrollen ska köras även om kursen misslyckas
        run: npm run vaxelkurs

      - name: Källkontroll
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: npm run kontrollera -- ${{ inputs.lage == 'foresla' && '--foresla' || '' }}

      - name: Spara ändringar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config.json data/regler.json rapporter
          if git diff --cached --quiet; then
            echo "Inga ändringar att spara."
          else
            git commit -m "Källkontroll $(date -u +%F)"
            git pull --rebase
            git push
          fi

      - name: Flagga misslyckad växelkurs
        if: steps.kurs.outcome == 'failure'
        run: |
          echo "::error::Växelkursen kunde inte hämtas. config.json är orörd."
          exit 1
